<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodReels - Test App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #root {
      height: 100%;
    }

    /* Test Page Styles */
    .test-container {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .test-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .test-logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .test-logo h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .test-logo p {
      color: #666;
      margin-top: 10px;
    }

    .test-links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .test-btn {
      padding: 15px 30px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      text-align: center;
    }

    .test-btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .test-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    .test-btn-secondary {
      background: #f5f5f5;
      color: #333;
    }

    .test-btn-secondary:hover {
      background: #e5e5e5;
    }

    .test-section {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid #eee;
    }

    .test-section h3 {
      color: #333;
      margin-bottom: 15px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="test-container">
      <div class="test-card">
        <div class="test-logo">
          <h1>🍔 FoodReels</h1>
          <p>Your favorite food delivery app</p>
        </div>

        <div class="test-links">
          <a href="http://localhost:5174/user/login" class="test-btn test-btn-primary">
            👤 User Login
          </a>
          <a href="http://localhost:5174/user/register" class="test-btn test-btn-secondary">
            📝 User Register
          </a>
          <a href="http://localhost:5174/food-partner/login" class="test-btn test-btn-secondary">
            🏪 Partner Login
          </a>
          <a href="http://localhost:5174/food-partner/register" class="test-btn test-btn-secondary">
            🤝 Partner Register
          </a>
        </div>

        <div class="test-section">
          <h3>Quick Info</h3>
          <p style="color: #666; font-size: 14px; text-align: center;">
            Make sure the dev server is running!<br>
            Run: <code style="background: #f5f5f5; padding: 2px 6px; border-radius: 4px;">npm run dev</code>
          </p>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
